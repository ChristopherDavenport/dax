name: CI

# Manual until the repository has a DEX_DEPS_TOKEN secret. dex depends on
# agentconsole, which is private, so `go` cannot fetch it on a runner
# without a token that can read it: a fine-grained personal access token
# with read access to the agentconsole repository (and the sibling
# modules, if they are private too), stored as the DEX_DEPS_TOKEN secret.
# Until then the gate is local: GOWORK=off GOFLAGS=-mod=readonly make check.
# Once the secret exists, add `push: {branches: [main]}` and `pull_request:`
# beside workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPRIVATE: github.com/ChristopherDavenport/*

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.25 is the floor declared in go.mod; stable is the current release.
        go: ["1.25.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Let git fetch the private modules
        env:
          DEX_DEPS_TOKEN: ${{ secrets.DEX_DEPS_TOKEN }}
        run: |
          test -n "$DEX_DEPS_TOKEN" || { echo "the DEX_DEPS_TOKEN secret is not set; see the comment at the top of this file"; exit 1; }
          git config --global url."https://x-access-token:${DEX_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Build
        run: make build
      - name: Vet
        run: make vet
      - name: Test
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Let git fetch the private modules
        env:
          DEX_DEPS_TOKEN: ${{ secrets.DEX_DEPS_TOKEN }}
        run: |
          test -n "$DEX_DEPS_TOKEN" || { echo "the DEX_DEPS_TOKEN secret is not set; see the comment at the top of this file"; exit 1; }
          git config --global url."https://x-access-token:${DEX_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Check formatting
        run: make fmt
      - name: Check go.mod and go.sum are tidy
        run: make tidy-check
      - name: staticcheck
        run: make lint
      - name: govulncheck
        run: make vuln

  # Single required status check for branch protection; it fails if any job
  # above failed, was cancelled or was skipped.
  checks:
    name: Checks
    if: always()
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
